id: trino-lakehouse
name: Trino + Hive Metastore + MinIO
category: Lakehouse
emoji: 🏔️
difficulty: expert
summary: A local lakehouse — query Parquet on S3-compatible storage with Trino SQL via a Hive Metastore. Federate across sources.
tags: [trino, hive, minio, s3, lakehouse, presto, federation]
prerequisites:
  - Docker + Compose, ~4 GB RAM
  - "The heaviest recipe here — four services that must wire together"

blocks:
  - type: md
    body: |
      ## What you get
      The classic open lakehouse: **MinIO** (S3-compatible object store) holds
      the data, a **Hive Metastore** (backed by Postgres) holds the table schemas,
      and **Trino** runs distributed SQL over it all. Trino can also *federate* —
      join a Hive table to a live Postgres table in one query.

      - Trino UI/SQL: http://localhost:8090
      - MinIO console: http://localhost:9001 (minio / minio123)

  - type: code
    language: yaml
    filename: docker-compose.lakehouse.yml
    body: |
      services:
        minio:
          image: minio/minio
          command: server /data --console-address ":9001"
          ports: ["9000:9000", "9001:9001"]
          environment:
            MINIO_ROOT_USER: minio
            MINIO_ROOT_PASSWORD: minio123
          volumes: ["minio_data:/data"]

        # create the bucket once minio is up
        minio-init:
          image: minio/mc
          depends_on: [minio]
          entrypoint: >
            /bin/sh -c "
            until mc alias set local http://minio:9000 minio minio123; do sleep 2; done;
            mc mb -p local/datalake;
            exit 0;"

        metastore-db:
          image: postgres:16
          environment:
            POSTGRES_USER: hive
            POSTGRES_PASSWORD: hive
            POSTGRES_DB: metastore
          volumes: ["metastore_pg:/var/lib/postgresql/data"]

        hive-metastore:
          image: starburstdata/hive:3.1.3-e.4
          depends_on: [metastore-db, minio]
          ports: ["9083:9083"]
          environment:
            HIVE_METASTORE_DRIVER: org.postgresql.Driver
            HIVE_METASTORE_JDBC_URL: jdbc:postgresql://metastore-db:5432/metastore
            HIVE_METASTORE_USER: hive
            HIVE_METASTORE_PASSWORD: hive
            HIVE_METASTORE_WAREHOUSE_DIR: s3://datalake/
            S3_ENDPOINT: http://minio:9000
            S3_ACCESS_KEY: minio
            S3_SECRET_KEY: minio123
            S3_PATH_STYLE_ACCESS: "true"
            REGION: ""

        trino:
          image: trinodb/trino:latest
          ports: ["8090:8080"]
          depends_on: [hive-metastore]
          volumes:
            - ./catalog:/etc/trino/catalog

      volumes:
        minio_data:
        metastore_pg:

  - type: md
    body: |
      ## Trino catalog
      Create `./catalog/hive.properties` next to the compose file:
  - type: code
    language: ini
    filename: catalog/hive.properties
    body: |
      connector.name=hive
      hive.metastore.uri=thrift://hive-metastore:9083
      hive.s3.endpoint=http://minio:9000
      hive.s3.aws-access-key=minio
      hive.s3.aws-secret-key=minio123
      hive.s3.path-style-access=true
      hive.non-managed-table-writes-enabled=true

  - type: md
    body: |
      ## Start it
  - type: code
    language: bash
    body: |
      mkdir -p catalog   # then add hive.properties above
      docker compose -f docker-compose.lakehouse.yml up -d
      # give the metastore ~30s on first boot to migrate its schema

  - type: md
    body: |
      ## Create a schema + table and query it
  - type: code
    language: bash
    body: |
      docker exec -it $(docker compose -f docker-compose.lakehouse.yml ps -q trino) trino
  - type: code
    language: sql
    body: |
      -- inside the Trino CLI
      CREATE SCHEMA hive.demo WITH (location = 's3://datalake/demo/');

      CREATE TABLE hive.demo.orders (
        id int, customer_id int, amount double, status varchar
      ) WITH (format = 'PARQUET', external_location = 's3://datalake/demo/orders/');

      INSERT INTO hive.demo.orders VALUES
        (1, 1, 120.5, 'paid'), (2, 2, -5.0, 'paid'), (3, 3, 80.0, 'pending');

      -- a data-quality query over the lake
      SELECT count(*) AS bad_amounts FROM hive.demo.orders WHERE amount < 0;

  - type: md
    body: |
      ## Federation (the killer feature)
      Add a `postgres.properties` catalog pointing at any Postgres, then **join
      lake data to live operational data in one query**:
  - type: code
    language: ini
    filename: catalog/postgres.properties
    body: |
      connector.name=postgresql
      connection-url=jdbc:postgresql://host.docker.internal:5434/demo
      connection-user=demo
      connection-password=demo
  - type: code
    language: sql
    body: |
      SELECT o.id, o.amount, c.full_name
      FROM hive.demo.orders o
      JOIN postgres.public.customers c ON o.customer_id = c.id;

  - type: code
    language: bash
    body: |
      docker compose -f docker-compose.lakehouse.yml down -v

use_cases:
  - title: Query-in-place data lake
    body: Land raw Parquet/ORC in object storage and query it with SQL — no loading into a warehouse, pay only for compute when you query.
  - title: Cross-source federation
    body: Join a warehouse fact table to a live Postgres dimension and a Kafka-fed lake table in a single Trino query, no ETL.
  - title: Cheap historical storage
    body: Keep years of cold data in MinIO/S3 at object-store prices while still making it queryable on demand.
  - title: Lakehouse data quality
    body: Run completeness/validity checks directly against lake tables before they're promoted to curated zones.
